<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="tc-title tc-desc">
  <title id="tc-title">Collections and repositories are many-to-many</title>
  <desc id="tc-desc">Three uploads from two repositories land in two collections. The api repository splits its unit tests and end-to-end tests across two collections, and the Unit Tests collection receives uploads from both the api and web repositories.</desc>
  <style>
    .bg { fill: #ffffff; }
    .card { fill: #f6f8f8; stroke: #d3dedb; }
    .card-accent { fill: #e6f1f0; stroke: #9fc6c4; }
    .label { fill: #16211f; font: 600 14px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sub { fill: #5d6b68; font: 400 11px ui-monospace, "SF Mono", Menlo, monospace; }
    .head { fill: #0c6c6e; font: 600 11px ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.09em; }
    .flow { stroke: #7f9b98; fill: none; stroke-width: 1.5; }
    .flow-accent { stroke: #0c6c6e; fill: none; stroke-width: 1.75; }
    .tip { fill: #7f9b98; }
    .tip-accent { fill: #0c6c6e; }
    .note { fill: #5d6b68; font: 400 12px ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1413; }
      .card { fill: #182322; stroke: #2e3d3b; }
      .card-accent { fill: #14302f; stroke: #3f6d6b; }
      .label { fill: #e6efed; }
      .sub { fill: #9dadaa; }
      .head { fill: #52c0be; }
      .flow { stroke: #6f8b88; }
      .flow-accent { stroke: #52c0be; }
      .tip { fill: #6f8b88; }
      .tip-accent { fill: #52c0be; }
      .note { fill: #9dadaa; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="760" height="330" />

  <text class="head" x="24" y="30">REPOSITORIES</text>
  <text class="head" x="512" y="30">COLLECTIONS</text>

  <rect class="card" x="24" y="46" width="188" height="52" rx="6" />
  <text class="label" x="40" y="70">api</text>
  <text class="sub" x="40" y="88">unit tests</text>

  <rect class="card" x="24" y="120" width="188" height="52" rx="6" />
  <text class="label" x="40" y="144">api</text>
  <text class="sub" x="40" y="162">end-to-end tests</text>

  <rect class="card" x="24" y="194" width="188" height="52" rx="6" />
  <text class="label" x="40" y="218">web</text>
  <text class="sub" x="40" y="236">unit tests</text>

  <rect class="card-accent" x="512" y="72" width="224" height="52" rx="6" />
  <text class="label" x="528" y="96">Unit Tests</text>
  <text class="sub" x="528" y="114">--test-collection-id Ab3Kd9Zq</text>

  <rect class="card-accent" x="512" y="168" width="224" height="52" rx="6" />
  <text class="label" x="528" y="192">E2E Tests</text>
  <text class="sub" x="528" y="210">--test-collection-id Qz7Mp2Ln</text>

  <path class="flow-accent" d="M212 72 C 340 72, 380 88, 502 88" />
  <polygon class="tip-accent" points="501,83 511,88 501,93" />

  <path class="flow-accent" d="M212 146 C 340 146, 380 194, 502 194" />
  <polygon class="tip-accent" points="501,189 511,194 501,199" />

  <path class="flow" d="M212 220 C 340 220, 380 110, 502 110" />
  <polygon class="tip" points="501,105 511,110 501,115" />

  <text class="note" x="24" y="290">One repository can split across collections — the api repository above sends its unit</text>
  <text class="note" x="24" y="308">tests to one collection and its end-to-end tests to another. One collection can span repositories.</text>
</svg>
