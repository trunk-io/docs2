<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img" aria-label="Two stacked panels contrast a single queue with parallel queues. PRs are column-aligned with A on the right and D on the left, flowing right to left. Top: a single queue box holds all four PRs A, B, C, D and runs one long test that finishes late, then a green check appears on each PR. Bottom: three lane boxes split by impacted target run at once and finish early. Frontend lane holds A and C, backend lane holds B and C, docs lane holds D. PR C touches both frontend and backend so its tile is half blue and half purple. A green check appears on each lane box as it finishes.">
  <!--
    Parallel queues prototype animation (editable, no source video needed).
    Queues flow right to left: A is at the FRONT (far right column), D is at the
    BACK (far left column). Every PR keeps a fixed column across both panels:
      A x=300 (front/right), B x=252, C x=204, D x=156 (back/left).
    PRs colored by impacted target: A frontend (blue), B backend (purple),
    D docs (teal), C touches frontend AND backend (half blue / half purple).

    Core contrast: one slow queue vs several fast queues split by impacted target.
      SINGLE QUEUE: one box holds all four PRs, one long bar finishes LATE (~62%).
        A green check then appears on EACH PR (A, B, C, D) at once.
      PARALLEL QUEUES: each queue is its own little container box. The three lane
        bars run concurrently and finish EARLY (~30%); a green check pops on each
        lane box, and a "done sooner" flag fires, long before the single queue.

    CONVENTION shared across all merge-queue animation prototypes:
      - 9s loop. Action in the first ~66% (about 6s), then the finished frame
        HOLDS for ~3s before the loop resets (the linger).
      - Bars carry state by COLOR (amber = testing, green = done). Nothing fades
        out before the reset, so the frozen end-state reads as "all done".
  -->
  <style>
    .bar { transform-box: fill-box; transform-origin: left center; }
    .barSqA { animation: pqBarSqA 9s linear infinite; }
    .barSqB { animation: pqBarSqB 9s linear infinite; }
    .barSqC { animation: pqBarSqC 9s linear infinite; }
    .barSqD { animation: pqBarSqD 9s linear infinite; }
    .barFe { animation: pqBarFe 9s linear infinite; }
    .barBe { animation: pqBarBe 9s linear infinite; }
    .barDocs { animation: pqBarDocs 9s linear infinite; }
    .bdgSqA { animation: pqBdgSqA 9s linear infinite; }
    .bdgSqB { animation: pqBdgSqB 9s linear infinite; }
    .bdgSqC { animation: pqBdgSqC 9s linear infinite; }
    .bdgSqD { animation: pqBdgSqD 9s linear infinite; }
    .bdgFe { animation: pqBdgFe 9s linear infinite; }
    .bdgBe { animation: pqBdgBe 9s linear infinite; }
    .bdgDocs { animation: pqBdgDocs 9s linear infinite; }
    /* single queue: each PR tested ONE AT A TIME, front (A, right) first.
       The last one (D) finishes LATE (~64%), so the whole queue is slow. */
    @keyframes pqBarSqA { 0%,8% { transform: scaleX(0); fill: #e8932a; } 22% { transform: scaleX(1); fill: #e8932a; } 23%,100% { transform: scaleX(1); fill: #1d9b54; } }
    @keyframes pqBarSqB { 0%,22% { transform: scaleX(0); fill: #e8932a; } 36% { transform: scaleX(1); fill: #e8932a; } 37%,100% { transform: scaleX(1); fill: #1d9b54; } }
    @keyframes pqBarSqC { 0%,36% { transform: scaleX(0); fill: #e8932a; } 50% { transform: scaleX(1); fill: #e8932a; } 51%,100% { transform: scaleX(1); fill: #1d9b54; } }
    @keyframes pqBarSqD { 0%,50% { transform: scaleX(0); fill: #e8932a; } 64% { transform: scaleX(1); fill: #e8932a; } 65%,100% { transform: scaleX(1); fill: #1d9b54; } }
    /* parallel lanes: all fill concurrently, finish EARLY (~30%), hold to 100% */
    @keyframes pqBarFe { 0%,8% { transform: scaleX(0); fill: #e8932a; } 30% { transform: scaleX(1); fill: #e8932a; } 31%,100% { transform: scaleX(1); fill: #1d9b54; } }
    @keyframes pqBarBe { 0%,8% { transform: scaleX(0); fill: #e8932a; } 30% { transform: scaleX(1); fill: #e8932a; } 31%,100% { transform: scaleX(1); fill: #1d9b54; } }
    @keyframes pqBarDocs { 0%,8% { transform: scaleX(0); fill: #e8932a; } 30% { transform: scaleX(1); fill: #e8932a; } 31%,100% { transform: scaleX(1); fill: #1d9b54; } }
    /* single-queue per-PR checks pop one at a time, each as its own run finishes */
    @keyframes pqBdgSqA { 0%,22% { opacity: 0; } 24%,100% { opacity: 1; } }
    @keyframes pqBdgSqB { 0%,36% { opacity: 0; } 38%,100% { opacity: 1; } }
    @keyframes pqBdgSqC { 0%,50% { opacity: 0; } 52%,100% { opacity: 1; } }
    @keyframes pqBdgSqD { 0%,64% { opacity: 0; } 66%,100% { opacity: 1; } }
    /* parallel lane-box checks pop early (~32%) and hold */
    @keyframes pqBdgFe { 0%,30% { opacity: 0; } 32%,100% { opacity: 1; } }
    @keyframes pqBdgBe { 0%,30% { opacity: 0; } 32%,100% { opacity: 1; } }
    @keyframes pqBdgDocs { 0%,30% { opacity: 0; } 32%,100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .barSqA, .barSqB, .barSqC, .barSqD, .barFe, .barBe, .barDocs,
      .bdgSqA, .bdgSqB, .bdgSqC, .bdgSqD, .bdgFe, .bdgBe, .bdgDocs { animation: none; }
      .bar { transform: scaleX(1); fill: #1d9b54; }
      .bdgSqA, .bdgSqB, .bdgSqC, .bdgSqD, .bdgFe, .bdgBe, .bdgDocs { opacity: 1; }
    }
  </style>

  <rect x="0" y="0" width="660" height="330" rx="10" fill="#ffffff"/>
  <text x="16" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#3a4350">One busy queue becomes many: split work by what each PR touches</text>

  <!-- ===================== TOP PANEL: single queue ===================== -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="16" y="50" font-size="11.5" font-weight="700" fill="#5b6573">Single queue (one lane)</text>
    <text x="636" y="50" text-anchor="end" font-size="11" fill="#9aa3b0">front of queue &#8594;</text>

    <!-- D docs teal (back, left) -->
    <rect x="156" y="64" width="40" height="26" rx="6" fill="#e2f4f1" stroke="#18a394" stroke-width="1.5"/>
    <text x="176" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7d70">D</text>
    <!-- C split blue/purple (both targets, no divider line) -->
    <clipPath id="ccSingle"><rect x="204" y="64" width="40" height="26" rx="6"/></clipPath>
    <g clip-path="url(#ccSingle)"><rect x="204" y="64" width="20" height="26" fill="#e3edfc"/><rect x="224" y="64" width="20" height="26" fill="#eee7fb"/></g>
    <rect x="204" y="64" width="40" height="26" rx="6" fill="none" stroke="#8b93a0" stroke-width="1.5"/>
    <text x="224" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#3a4350">C</text>
    <!-- B backend purple -->
    <rect x="252" y="64" width="40" height="26" rx="6" fill="#eee7fb" stroke="#7c5cdb" stroke-width="1.5"/>
    <text x="272" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#5a3fb0">B</text>
    <!-- A frontend blue (front, right) -->
    <rect x="300" y="64" width="40" height="26" rx="6" fill="#e3edfc" stroke="#346DDB" stroke-width="1.5"/>
    <text x="320" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fc0">A</text>

    <!-- a separate run per PR, completing ONE AT A TIME (A front/right first) -->
    <rect x="156" y="93" width="40" height="5" rx="2.5" fill="#d9dee6"/>
    <rect class="bar barSqD" x="156" y="93" width="40" height="5" rx="2.5" fill="#e8932a"/>
    <rect x="204" y="93" width="40" height="5" rx="2.5" fill="#d9dee6"/>
    <rect class="bar barSqC" x="204" y="93" width="40" height="5" rx="2.5" fill="#e8932a"/>
    <rect x="252" y="93" width="40" height="5" rx="2.5" fill="#d9dee6"/>
    <rect class="bar barSqB" x="252" y="93" width="40" height="5" rx="2.5" fill="#e8932a"/>
    <rect x="300" y="93" width="40" height="5" rx="2.5" fill="#d9dee6"/>
    <rect class="bar barSqA" x="300" y="93" width="40" height="5" rx="2.5" fill="#e8932a"/>

    <!-- a green check on each PR, popping one at a time as its own run finishes -->
    <g class="bdgSqD"><circle cx="194" cy="66" r="6" fill="#1d9b54" stroke="#fff" stroke-width="1.3"/><polyline points="191,66 193,68.2 197,63.4" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="bdgSqC"><circle cx="242" cy="66" r="6" fill="#1d9b54" stroke="#fff" stroke-width="1.3"/><polyline points="239,66 241,68.2 245,63.4" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="bdgSqB"><circle cx="290" cy="66" r="6" fill="#1d9b54" stroke="#fff" stroke-width="1.3"/><polyline points="287,66 289,68.2 293,63.4" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g class="bdgSqA"><circle cx="338" cy="66" r="6" fill="#1d9b54" stroke="#fff" stroke-width="1.3"/><polyline points="335,66 337,68.2 341,63.4" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g>

    <text x="356" y="84" font-size="11" fill="#5b6573">tested one at a time,</text>
    <text x="356" y="98" font-size="11" fill="#5b6573">finishes late</text>
  </g>

  <!-- divider between panels -->
  <line x1="16" y1="120" x2="644" y2="120" stroke="#e3e7ee" stroke-width="1"/>

  <!-- ================== BOTTOM PANEL: parallel queues ================== -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="16" y="142" font-size="11.5" font-weight="700" fill="#5b6573">Parallel queues (each split by impacted target)</text>

    <!-- frontend lane box: holds A (right) and C -->
    <rect x="198" y="156" width="148" height="40" rx="8" fill="#f7f9fc" stroke="#9aa3b0" stroke-width="1.5"/>
    <text x="16" y="180" font-size="11" font-weight="600" fill="#1f5fc0">frontend</text>
    <clipPath id="ccFe"><rect x="204" y="161" width="40" height="26" rx="6"/></clipPath>
    <g clip-path="url(#ccFe)"><rect x="204" y="161" width="20" height="26" fill="#e3edfc"/><rect x="224" y="161" width="20" height="26" fill="#eee7fb"/></g>
    <rect x="204" y="161" width="40" height="26" rx="6" fill="none" stroke="#8b93a0" stroke-width="1.5"/>
    <text x="224" y="179" text-anchor="middle" font-size="12" font-weight="700" fill="#3a4350">C</text>
    <rect x="300" y="161" width="40" height="26" rx="6" fill="#e3edfc" stroke="#346DDB" stroke-width="1.5"/>
    <text x="320" y="179" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fc0">A</text>
    <rect x="204" y="189" width="136" height="4" rx="2" fill="#d9dee6"/>
    <rect class="bar barFe" x="204" y="189" width="136" height="4" rx="2" fill="#e8932a"/>
    <g class="bdgFe"><circle cx="342" cy="158" r="6.5" fill="#1d9b54" stroke="#fff" stroke-width="1.3"/><polyline points="339,158 341,160.4 345,155.6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>

    <!-- backend lane box: holds B (right) and C -->
    <rect x="198" y="204" width="100" height="40" rx="8" fill="#f7f9fc" stroke="#9aa3b0" stroke-width="1.5"/>
    <text x="16" y="228" font-size="11" font-weight="600" fill="#5a3fb0">backend</text>
    <clipPath id="ccBe"><rect x="204" y="209" width="40" height="26" rx="6"/></clipPath>
    <g clip-path="url(#ccBe)"><rect x="204" y="209" width="20" height="26" fill="#e3edfc"/><rect x="224" y="209" width="20" height="26" fill="#eee7fb"/></g>
    <rect x="204" y="209" width="40" height="26" rx="6" fill="none" stroke="#8b93a0" stroke-width="1.5"/>
    <text x="224" y="227" text-anchor="middle" font-size="12" font-weight="700" fill="#3a4350">C</text>
    <rect x="252" y="209" width="40" height="26" rx="6" fill="#eee7fb" stroke="#7c5cdb" stroke-width="1.5"/>
    <text x="272" y="227" text-anchor="middle" font-size="12" font-weight="700" fill="#5a3fb0">B</text>
    <rect x="204" y="237" width="88" height="4" rx="2" fill="#d9dee6"/>
    <rect class="bar barBe" x="204" y="237" width="88" height="4" rx="2" fill="#e8932a"/>
    <g class="bdgBe"><circle cx="294" cy="206" r="6.5" fill="#1d9b54" stroke="#fff" stroke-width="1.3"/><polyline points="291,206 293,208.4 297,203.6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>

    <!-- docs lane box: holds D (far left, independent) -->
    <rect x="150" y="252" width="52" height="40" rx="8" fill="#f7f9fc" stroke="#9aa3b0" stroke-width="1.5"/>
    <text x="16" y="276" font-size="11" font-weight="600" fill="#0e7d70">docs</text>
    <rect x="156" y="257" width="40" height="26" rx="6" fill="#e2f4f1" stroke="#18a394" stroke-width="1.5"/>
    <text x="176" y="275" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7d70">D</text>
    <rect x="156" y="285" width="40" height="4" rx="2" fill="#d9dee6"/>
    <rect class="bar barDocs" x="156" y="285" width="40" height="4" rx="2" fill="#e8932a"/>
    <g class="bdgDocs"><circle cx="198" cy="254" r="6.5" fill="#1d9b54" stroke="#fff" stroke-width="1.3"/><polyline points="195,254 197,256.4 201,251.6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>

    <!-- "done sooner" flag where the parallel lanes complete (early), holds to 100% -->
    <g class="bdgFe">
      <line x1="360" y1="156" x2="360" y2="292" stroke="#1d9b54" stroke-width="1.5" stroke-dasharray="3 3"/>
      <rect x="416" y="206" width="150" height="32" rx="8" fill="#e4f5ea" stroke="#1d9b54" stroke-width="1.5"/>
      <circle cx="434" cy="222" r="8.5" fill="#1d9b54"/>
      <polyline points="430,222 433,225 438,219" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="450" y="226" font-size="11.5" font-weight="700" fill="#1d7a4d">done sooner</text>
    </g>

    <text x="16" y="312" font-size="11" fill="#5b6573">three short queues run at once and finish early, so PRs spend less time waiting</text>
  </g>
</svg>
