<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="660" height="250" role="img" aria-label="Three dynamic parallel queues split by impacted target, animated. Four PRs are routed into three independent lane boxes by what they touch. The frontend lane holds PR A and PR C, the backend lane holds PR B and PR C, and the docs lane holds PR D. PR A is a blue frontend tile, PR B is a purple backend tile, PR D is a teal docs tile, and PR C touches both frontend and backend so its tile is split half blue and half purple and appears in both lanes. The animation shows the three front PRs A, B and D testing at the same time across their lanes, each finishing with a green check, then PR C testing in both the frontend and backend lanes because it includes the changes from A and B. PRs are column-aligned with the front of each queue on the right.">
  <!--
    Timeline, loop 4.5s, one scan bar is 0.5s (11.111%):
      0 to 11.111%      front PRs A, B, D test in parallel (one per lane)
      11.111%           A, B, D pass, green checks pop
      11.111 to 17.778% short pause (~0.3s)
      17.778 to 28.889% C tests in the frontend and backend lanes (it includes A and B)
      28.889%           C passes in both lanes, green checks pop
      28.889 to 100%    hold the finished frame (~3.2s) then loop
  -->
  <style>
    .bar { transform-box: fill-box; transform-origin: left; animation-duration: 4.5s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .barFront { animation-name: barFront; }
    .barC { animation-name: barC; }
    .badge { transform-box: fill-box; transform-origin: center; opacity: 0; }
    .bFront { animation: popFront 4.5s infinite; }
    .bC { animation: popC 4.5s infinite; }

    @keyframes barFront {
      0%      { transform: scaleX(0); fill: #e8932a; }
      11.111% { transform: scaleX(1); fill: #e8932a; }
      12%     { fill: #1d9b54; }
      100%    { transform: scaleX(1); fill: #1d9b54; }
    }
    @keyframes barC {
      0%      { transform: scaleX(0); fill: #e8932a; }
      17.778% { transform: scaleX(0); fill: #e8932a; }
      28.889% { transform: scaleX(1); fill: #e8932a; }
      29.7%   { fill: #1d9b54; }
      100%    { transform: scaleX(1); fill: #1d9b54; }
    }
    @keyframes popFront {
      0%, 11.111% { opacity: 0; transform: scale(0.4); }
      13.5%       { opacity: 1; transform: scale(1.15); }
      15.5%       { opacity: 1; transform: scale(1); }
      100%        { opacity: 1; transform: scale(1); }
    }
    @keyframes popC {
      0%, 28.889% { opacity: 0; transform: scale(0.4); }
      31.3%       { opacity: 1; transform: scale(1.15); }
      33.3%       { opacity: 1; transform: scale(1); }
      100%        { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar { animation: none; transform: scaleX(1); fill: #1d9b54; }
      .badge { animation: none; opacity: 1; transform: scale(1); }
    }
  </style>

  <rect x="0" y="0" width="660" height="250" rx="10" fill="#ffffff"/>
  <text x="16" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#3a4350">Three dynamic parallel queues, split by impacted target</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="636" y="50" text-anchor="end" font-size="11" fill="#9aa3b0">front of queue &#8594;</text>

    <!-- ===================== frontend lane: A (front/right) and C ===================== -->
    <rect x="198" y="60" width="148" height="40" rx="8" fill="#f7f9fc" stroke="#9aa3b0" stroke-width="1.5"/>
    <text x="16" y="84" font-size="11.5" font-weight="600" fill="#1f5fc0">frontend</text>
    <!-- C split blue/purple (both targets, no divider line) -->
    <clipPath id="ccFe"><rect x="204" y="63" width="46" height="34" rx="6"/></clipPath>
    <g clip-path="url(#ccFe)"><rect x="204" y="63" width="23" height="34" fill="#e3edfc"/><rect x="227" y="63" width="23" height="34" fill="#eee7fb"/></g>
    <rect x="204" y="63" width="46" height="34" rx="6" fill="none" stroke="#8b93a0" stroke-width="1.5"/>
    <text x="227" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#3a4350">C</text>
    <!-- C frontend scan bar (cycle 2) -->
    <rect x="207" y="91" width="40" height="3" rx="1.5" fill="#d9dee6"/>
    <rect x="207" y="91" width="40" height="3" rx="1.5" fill="#e8932a" class="bar barC"/>
    <!-- A frontend blue (front, right) -->
    <rect x="294" y="63" width="46" height="34" rx="6" fill="#e3edfc" stroke="#346DDB" stroke-width="1.5"/>
    <text x="317" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fc0">A</text>
    <!-- A scan bar (cycle 1) -->
    <rect x="297" y="91" width="40" height="3" rx="1.5" fill="#d9dee6"/>
    <rect x="297" y="91" width="40" height="3" rx="1.5" fill="#e8932a" class="bar barFront"/>

    <!-- ===================== backend lane: B (front/right) and C ===================== -->
    <rect x="246" y="112" width="100" height="40" rx="8" fill="#f7f9fc" stroke="#9aa3b0" stroke-width="1.5"/>
    <text x="16" y="136" font-size="11.5" font-weight="600" fill="#5a3fb0">backend</text>
    <!-- C split blue/purple -->
    <clipPath id="ccBe"><rect x="252" y="115" width="46" height="34" rx="6"/></clipPath>
    <g clip-path="url(#ccBe)"><rect x="252" y="115" width="23" height="34" fill="#e3edfc"/><rect x="275" y="115" width="23" height="34" fill="#eee7fb"/></g>
    <rect x="252" y="115" width="46" height="34" rx="6" fill="none" stroke="#8b93a0" stroke-width="1.5"/>
    <text x="275" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#3a4350">C</text>
    <!-- C backend scan bar (cycle 2) -->
    <rect x="255" y="143" width="40" height="3" rx="1.5" fill="#d9dee6"/>
    <rect x="255" y="143" width="40" height="3" rx="1.5" fill="#e8932a" class="bar barC"/>
    <!-- B backend purple (front, right) -->
    <rect x="294" y="115" width="46" height="34" rx="6" fill="#eee7fb" stroke="#7c5cdb" stroke-width="1.5"/>
    <text x="317" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#5a3fb0">B</text>
    <!-- B scan bar (cycle 1) -->
    <rect x="297" y="143" width="40" height="3" rx="1.5" fill="#d9dee6"/>
    <rect x="297" y="143" width="40" height="3" rx="1.5" fill="#e8932a" class="bar barFront"/>

    <!-- ===================== docs lane: D ===================== -->
    <rect x="294" y="164" width="52" height="40" rx="8" fill="#f7f9fc" stroke="#9aa3b0" stroke-width="1.5"/>
    <text x="16" y="188" font-size="11.5" font-weight="600" fill="#0e7d70">docs</text>
    <rect x="294" y="167" width="46" height="34" rx="6" fill="#e2f4f1" stroke="#18a394" stroke-width="1.5"/>
    <text x="317" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7d70">D</text>
    <!-- D scan bar (cycle 1) -->
    <rect x="297" y="195" width="40" height="3" rx="1.5" fill="#d9dee6"/>
    <rect x="297" y="195" width="40" height="3" rx="1.5" fill="#e8932a" class="bar barFront"/>

    <!-- ===================== completion badges (drawn last, on top) ===================== -->
    <!-- A pass (top-right) -->
    <g class="badge bFront">
      <circle cx="337" cy="66" r="6.5" fill="#1d9b54" stroke="#fff" stroke-width="1.3"/>
      <polyline points="334,66 336.2,68.4 340,63.8" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- B pass (top-right) -->
    <g class="badge bFront">
      <circle cx="337" cy="118" r="6.5" fill="#1d9b54" stroke="#fff" stroke-width="1.3"/>
      <polyline points="334,118 336.2,120.4 340,115.8" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- D pass (top-right) -->
    <g class="badge bFront">
      <circle cx="337" cy="170" r="6.5" fill="#1d9b54" stroke="#fff" stroke-width="1.3"/>
      <polyline points="334,170 336.2,172.4 340,167.8" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- C frontend pass (top-right, clear of A) -->
    <g class="badge bC">
      <circle cx="247" cy="66" r="6.5" fill="#1d9b54" stroke="#fff" stroke-width="1.3"/>
      <polyline points="244,66 246.2,68.4 250,63.8" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- C backend pass (top-left, since this tile underlaps the B tile on its right) -->
    <g class="badge bC">
      <circle cx="255" cy="118" r="6.5" fill="#1d9b54" stroke="#fff" stroke-width="1.3"/>
      <polyline points="252,118 254.2,120.4 258,115.8" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- note: C is tested in both lanes because it touches both targets -->
    <line x1="16" y1="224" x2="644" y2="224" stroke="#e3e7ee" stroke-width="1"/>
    <text x="16" y="242" font-size="11.5" fill="#5b6573">PR C touches frontend and backend, so it is tested in both lanes; each queue runs on its own.</text>
  </g>
</svg>
