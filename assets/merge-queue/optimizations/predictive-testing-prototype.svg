<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 296" width="660" height="296" role="img" aria-label="A merge queue ordered front to back: PR A is at the front (far right) with nothing ahead of it; PR B is tested with A's changes; PR C is tested with A and B's changes. Each PR carries the code ahead of it. Tests pass in queue order, then all three merge into main.">
  <!--
    Predictive testing prototype animation (editable, no source video needed).
    Queue runs front-to-back, right-to-left: A is at the front (far right),
    then B, then C at the back (far left). Each PR's row extends RIGHTWARD to
    include the PRs ahead of it (the code ahead). No "main" tile, matching the
    source video.

    CONVENTION shared across all merge-queue animation prototypes:
      - 9s loop. All action plays out in the first ~66% (about 6s), then the
        finished frame HOLDS for ~3s before the loop resets (the linger).
      - When a row's progress bar completes, a green check BADGE pops into that
        row's bundle upper-right corner and stays lit through the hold.
      - Nothing fades out before the reset: checks, badges, bars and the merge
        glow all stay visible at 100%, so the frozen / reduced-motion end-state
        reads as "all done".

    One 9s CSS loop, staggered so each PR tests then passes in queue order:
      A tests  4%->13%  -> A badge pops ~15%, stays lit
      B tests 19%->28%  -> B badge pops ~30%, stays lit
      C tests 35%->43%  -> C badge pops ~46%, stays lit
      merge glow 50%->63%: A, B, C land in main, holds to 100%
    Reads correctly frozen: the column-aligned tiles + labels carry the meaning;
    the amber progress bars / green badges / merge glow only enhance.
    To retime, edit the @keyframes percentages. To add a PR, add a row plus a
    tile in a new left column, and widen that row's grey track + amber bar.
    Columns: A x=590 (front/right), B x=536, C x=482 (back/left).
    The rightmost tile in every row is tile A at x=590 (right edge 636); each
    row's completion badge sits at cx=632 in that row's upper-right corner.
  -->
  <style>
    .bar { transform-box: fill-box; transform-origin: left center; }
    .barA { animation: ptBarA 9s linear infinite; }
    .barB { animation: ptBarB 9s linear infinite; }
    .barC { animation: ptBarC 9s linear infinite; }
    .badgeA { animation: ptBadgeA 9s linear infinite; }
    .badgeB { animation: ptBadgeB 9s linear infinite; }
    .badgeC { animation: ptBadgeC 9s linear infinite; }
    .mergeGlow { animation: ptMerge 9s linear infinite; }
    /* bars fill then HOLD their finished state to 100% (no end-of-loop fade) */
    @keyframes ptBarA { 0%,4% { transform: scaleX(0); opacity: 0; } 5% { opacity: 1; } 13%,100% { transform: scaleX(1); opacity: 1; } }
    @keyframes ptBarB { 0%,19% { transform: scaleX(0); opacity: 0; } 20% { opacity: 1; } 28%,100% { transform: scaleX(1); opacity: 1; } }
    @keyframes ptBarC { 0%,35% { transform: scaleX(0); opacity: 0; } 36% { opacity: 1; } 43%,100% { transform: scaleX(1); opacity: 1; } }
    /* completion badges: pop in right after each bar finishes, hold to 100% */
    @keyframes ptBadgeA { 0%,14% { opacity: 0; } 16%,100% { opacity: 1; } }
    @keyframes ptBadgeB { 0%,29% { opacity: 0; } 31%,100% { opacity: 1; } }
    @keyframes ptBadgeC { 0%,44% { opacity: 0; } 46%,100% { opacity: 1; } }
    @keyframes ptMerge { 0%,50% { opacity: 0; } 52%,100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .barA, .barB, .barC, .badgeA, .badgeB, .badgeC, .mergeGlow { animation: none; }
      .bar { transform: scaleX(1); opacity: 1; fill: #1d9b54; }
      .badgeA, .badgeB, .badgeC, .mergeGlow { opacity: 1; }
    }
  </style>

  <rect x="0" y="0" width="660" height="296" rx="10" fill="#ffffff"/>
  <text x="16" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#3a4350">Test newer code with the code ahead of it in the queue</text>
  <text x="636" y="24" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#9aa3b0">front of queue &#8594;</text>

  <!-- Row A: front of the queue, nothing ahead -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="16" y="44" width="64" height="34" rx="8" fill="#e3edfc" stroke="#346DDB" stroke-width="1.5"/>
    <text x="48" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fc0">PR A</text>
    <text x="92" y="65" font-size="11.5" fill="#5b6573">front of the queue, nothing ahead of it</text>
    <rect x="590" y="44" width="46" height="34" rx="6" fill="#e3edfc" stroke="#346DDB" stroke-width="1.5"/>
    <text x="613" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fc0">A</text>
    <rect x="590" y="83" width="46" height="5" rx="2.5" fill="#d9dee6"/>
    <rect class="bar barA" x="590" y="83" width="46" height="5" rx="2.5" fill="#e8932a"/>
    <g class="badgeA"><circle cx="632" cy="46" r="6.5" fill="#1d9b54" stroke="#fff" stroke-width="1.3"/><polyline points="629,46 631,48.4 635,43.6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>

  <!-- Row B: tested with A (the PR ahead of it) -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="16" y="108" width="64" height="34" rx="8" fill="#eee7fb" stroke="#7c5cdb" stroke-width="1.5"/>
    <text x="48" y="129" text-anchor="middle" font-size="12" font-weight="700" fill="#5a3fb0">PR B</text>
    <text x="92" y="129" font-size="11.5" fill="#5b6573">tested with <tspan font-weight="600" fill="#1f5fc0">A</tspan>, the PR ahead of it</text>
    <rect x="536" y="108" width="46" height="34" rx="6" fill="#eee7fb" stroke="#7c5cdb" stroke-width="1.5"/>
    <text x="559" y="129" text-anchor="middle" font-size="12" font-weight="700" fill="#5a3fb0">B</text>
    <rect x="590" y="108" width="46" height="34" rx="6" fill="#e3edfc" stroke="#346DDB" stroke-width="1.5"/>
    <text x="613" y="129" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fc0">A</text>
    <rect x="536" y="147" width="100" height="5" rx="2.5" fill="#d9dee6"/>
    <rect class="bar barB" x="536" y="147" width="100" height="5" rx="2.5" fill="#e8932a"/>
    <g class="badgeB"><circle cx="632" cy="110" r="6.5" fill="#1d9b54" stroke="#fff" stroke-width="1.3"/><polyline points="629,110 631,112.4 635,107.6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>

  <!-- Row C: tested with A and B (the PRs ahead of it) -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="16" y="172" width="64" height="34" rx="8" fill="#e2f4f1" stroke="#18a394" stroke-width="1.5"/>
    <text x="48" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7d70">PR C</text>
    <text x="92" y="193" font-size="11.5" fill="#5b6573">tested with <tspan font-weight="600" fill="#1f5fc0">A</tspan> and <tspan font-weight="600" fill="#5a3fb0">B</tspan>, the PRs ahead of it</text>
    <rect x="482" y="172" width="46" height="34" rx="6" fill="#e2f4f1" stroke="#18a394" stroke-width="1.5"/>
    <text x="505" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7d70">C</text>
    <rect x="536" y="172" width="46" height="34" rx="6" fill="#eee7fb" stroke="#7c5cdb" stroke-width="1.5"/>
    <text x="559" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#5a3fb0">B</text>
    <rect x="590" y="172" width="46" height="34" rx="6" fill="#e3edfc" stroke="#346DDB" stroke-width="1.5"/>
    <text x="613" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fc0">A</text>
    <rect x="482" y="211" width="154" height="5" rx="2.5" fill="#d9dee6"/>
    <rect class="bar barC" x="482" y="211" width="154" height="5" rx="2.5" fill="#e8932a"/>
    <g class="badgeC"><circle cx="632" cy="174" r="6.5" fill="#1d9b54" stroke="#fff" stroke-width="1.3"/><polyline points="629,174 631,176.4 635,171.6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>

  <!-- Merge result: all three land in main, in queue order -->
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="92" y="262" font-size="11.5" fill="#5b6573">tests pass in order, then merge safely</text>
    <rect x="400" y="238" width="236" height="40" rx="8" fill="#eef1f5" stroke="#9aa3b0" stroke-width="1.5"/>
    <rect class="mergeGlow" x="400" y="238" width="236" height="40" rx="8" fill="#e4f5ea" stroke="#1d9b54" stroke-width="1.8"/>
    <text x="518" y="263" text-anchor="middle" font-size="12" font-weight="700" fill="#1d7a4d">A &#8594; B &#8594; C merge into main</text>
  </g>
</svg>
