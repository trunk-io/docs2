<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 130" width="660" height="130" role="img" aria-label="The same merge queue, front on the right, concurrency two. An URGENT PR D, badged URGENT in red, has gone straight to the front and is testing. PR A is now testing in the second slot and was restarted because D jumped ahead of it. PR B was bumped back to pending, and PR C is still pending. Order right to left: D and A testing; then pending B; then pending C.">
  <rect x="0" y="0" width="660" height="130" rx="10" fill="#ffffff"/>
  <text x="16" y="24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#3a4350">An URGENT PR goes to the very front and tests immediately</text>
  <text x="644" y="24" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#9aa3b0">Front of queue &#8594;</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <!-- testing group bracket over the two front slots (x 480..638) -->
    <path d="M 480 50 L 480 45 L 638 45 L 638 50" fill="none" stroke="#e8932a" stroke-width="1.3"/>
    <text x="559" y="42" text-anchor="middle" font-size="9.5" font-weight="600" fill="#a85d00">testing (concurrency 2)</text>

    <!-- C: pending, back / leftmost (slot x=424) -->
    <g>
      <rect x="424" y="56" width="46" height="34" rx="6" fill="#eef1f5" stroke="#9aa3b0" stroke-width="1.5"/>
      <text x="447" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7d70">C</text>
      <text x="447" y="104" text-anchor="middle" font-size="9.5" font-weight="600" fill="#9aa3b0">pending</text>
    </g>

    <!-- B: bumped back to pending (slot x=480) -->
    <g>
      <rect x="480" y="56" width="46" height="34" rx="6" fill="#eef1f5" stroke="#9aa3b0" stroke-width="1.5"/>
      <text x="503" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#5a3fb0">B</text>
      <text x="503" y="104" text-anchor="middle" font-size="9.5" font-weight="600" fill="#9aa3b0">pending</text>
    </g>

    <!-- A: restarted, testing in second slot (slot x=536) -->
    <g>
      <rect x="536" y="56" width="46" height="34" rx="6" fill="#e3edfc" stroke="#346DDB" stroke-width="1.5"/>
      <text x="559" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fc0">A</text>
      <rect x="536" y="95" width="46" height="5" rx="2.5" fill="#d9dee6"/>
      <rect x="536" y="95" width="12" height="5" rx="2.5" fill="#e8932a"/>
      <text x="559" y="113" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1f5fc0">restarted</text>
    </g>

    <!-- D: URGENT priority, testing at the very front (slot x=592) -->
    <g>
      <rect x="592" y="56" width="46" height="34" rx="6" fill="#fde7e7" stroke="#d64545" stroke-width="1.8"/>
      <text x="615" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#b22222">D</text>
      <rect x="592" y="95" width="46" height="5" rx="2.5" fill="#d9dee6"/>
      <rect x="592" y="95" width="22" height="5" rx="2.5" fill="#e8932a"/>
      <text x="615" y="113" text-anchor="middle" font-size="9.5" font-weight="600" fill="#a85d00">testing</text>
      <!-- URGENT badge -->
      <rect x="588" y="44" width="50" height="15" rx="7.5" fill="#fde7e7" stroke="#d64545" stroke-width="1.3"/>
      <text x="613" y="55" text-anchor="middle" font-size="9" font-weight="700" fill="#b22222">URGENT</text>
    </g>
  </g>
</svg>
